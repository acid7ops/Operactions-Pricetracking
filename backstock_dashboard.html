<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Gerencial — Backstock Cosmetics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --nivea:#0057A8; --nivea-deep:#00294F; --nivea-mid:#0A3D73;
    --ink:#0B1C2C; --canvas:#EEF3F9; --paper:#FFFFFF; --mist:#E4EAF1;
    --muted:#5B6B7C; --line:#DCE4EE;
    --green:#158A4A; --amber:#D89A1F; --red:#C0392B;
    --r-sm:8px; --r-md:12px; --r-lg:18px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Inter',sans-serif; background:var(--canvas); color:var(--ink); }
  .topbar{ background:linear-gradient(135deg, var(--nivea-deep), var(--nivea-mid)); color:#fff; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  .topbar .brand{ display:flex; align-items:center; gap:12px; }
  .topbar .mark{ width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; }
  .topbar .mark svg{ width:20px; height:20px; }
  .topbar .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#A9C7E8; margin-bottom:2px; }
  .topbar h1{ margin:0; font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; }
  .topbar .badge{ font-family:'IBM Plex Mono',monospace; font-size:11px; background:rgba(255,255,255,.15); padding:5px 12px; border-radius:20px; }
  .shelf-ticks{ height:4px; background:linear-gradient(90deg, var(--nivea-mid) 0%, var(--nivea) 50%, var(--nivea-mid) 100%); }

  .viewtabs{ display:flex; gap:2px; background:var(--nivea-deep); padding:0 24px; }
  .viewtabs button{ background:transparent; border:none; color:#B9CFE6; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:12px 18px; cursor:pointer; border-bottom:3px solid transparent; }
  .viewtabs button.active{ color:#fff; border-bottom:3px solid var(--nivea); }

  .controlbar{ display:flex; align-items:center; justify-content:space-between; padding:12px 24px; background:var(--paper); border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px; }
  .weeksel{ display:flex; gap:6px; }
  .weeksel button{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:7px 14px; border-radius:20px; border:1px solid var(--line); background:var(--canvas); color:var(--muted); cursor:pointer; }
  .weeksel button.active{ background:var(--nivea); color:#fff; border-color:var(--nivea); }
  .breadcrumb{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted); }
  .breadcrumb span{ cursor:pointer; color:var(--nivea); }
  .breadcrumb span:hover{ text-decoration:underline; }

  .kpirow{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:16px 24px 0 24px; }
  .kpi-card{ background:var(--paper); border-radius:var(--r-md); padding:14px 16px; border:1px solid var(--line); }
  .kpi-label{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px; }
  .kpi-value{ font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; }

  .chain-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:12px 24px; }
  .chain-card{ background:var(--paper); border-radius:var(--r-md); padding:12px 16px; border:1px solid var(--line); }
  .chain-card .label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); text-transform:uppercase; }
  .chain-card .val{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; margin-top:2px; }
  .chain-card .sub{ font-size:11px; color:var(--muted); margin-top:2px; }

  .body{ flex:1; display:grid; grid-template-columns:1fr 460px; min-height:0; padding:0 24px 24px 24px; gap:16px; }
  #top10Body{ grid-template-columns:1fr; }

  .insights-col{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg); overflow-y:auto; padding:18px 20px; }
  .insight-block{ margin-bottom:24px; }
  .insight-block h3{ font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; margin:0 0 3px 0; }
  .insight-block .sub{ font-size:11.5px; color:var(--muted); margin:0 0 12px 0; }
  .insight-empty{ font-size:12px; color:var(--muted); background:var(--canvas); border-radius:var(--r-sm); padding:10px 12px; }

  table.sku-perf{ width:100%; border-collapse:collapse; font-size:12px; }
  table.sku-perf th{ text-align:left; font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; color:var(--muted); padding:5px 4px; border-bottom:1px solid var(--line); }
  table.sku-perf td{ padding:6px 4px; border-bottom:1px solid var(--mist); }
  table.sku-perf td.num{ font-family:'IBM Plex Mono',monospace; font-weight:700; text-align:right; }
  table.sku-perf tbody tr{ cursor:pointer; transition:background .12s; }
  table.sku-perf tbody tr:hover td{ background:var(--canvas); }
  .back-link{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--nivea); cursor:pointer; }
  .back-link:hover{ text-decoration:underline; }

  .comment-details summary{ cursor:pointer; font-size:12.5px; font-weight:600; color:var(--nivea-deep); padding:8px 10px; background:var(--canvas); border-radius:var(--r-sm); list-style:none; }
  .comment-details summary::-webkit-details-marker{ display:none; }
  .comment-details summary::before{ content:'▸ '; }
  .comment-details[open] summary::before{ content:'▾ '; }
  .comment-list{ list-style:none; margin:8px 0 0 0; padding:0; }
  .comment-list-row{ display:flex; justify-content:space-between; font-size:12px; padding:7px 10px; border-bottom:1px solid var(--mist); }
  .comment-list-row:last-child{ border-bottom:none; }
  .comment-list-cnt{ font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--nivea-deep); white-space:nowrap; margin-left:10px; }

  .side{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg); overflow-y:auto; padding:0; }
  .side-header{ padding:16px 20px 10px 20px; }
  .side-header h2{ font-family:'Space Grotesk',sans-serif; font-size:16px; margin:0 0 4px 0; }
  .side-header p{ font-size:11.5px; color:var(--muted); margin:0; }
  .cards{ padding:14px 20px; display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; }
  #top10Body .cards{ grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); }
  .card{ background:var(--canvas); border-radius:var(--r-md); padding:12px 14px; cursor:pointer; transition:transform .1s; }
  .card:hover{ transform:translateY(-1px); }
  .card-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .card-name{ font-weight:600; font-size:13.5px; }
  .card-msl{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px; }
  .card-sub{ display:flex; gap:10px; font-size:11px; color:var(--muted); margin-top:4px; }
  .bar-track{ height:5px; border-radius:3px; background:var(--mist); margin-top:8px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:3px; }

  .detail{ padding:16px 20px; }
  .detail .back-link{ display:inline-block; margin-bottom:10px; }
  .detail h2{ font-family:'IBM Plex Mono',monospace; font-size:19px; margin:0 0 3px 0; }
  .detail .addr{ font-size:12px; color:var(--muted); margin-bottom:2px; }
  .flag-note{ font-size:11px; color:var(--amber); background:#FBF2E2; padding:6px 10px; border-radius:var(--r-sm); margin:8px 0; }
  .metric-row{ display:flex; gap:10px; margin:12px 0 16px 0; }
  .metric-box{ flex:1; background:var(--canvas); border-radius:var(--r-md); padding:10px 12px; }
  .m-label{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; color:var(--muted); }
  .m-value{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; }

  table.skus{ width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:16px; table-layout:fixed; }
  table.skus th{ text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:6px 4px; border-bottom:1px solid var(--line); }
  table.skus td{ padding:7px 4px; border-bottom:1px solid var(--mist); vertical-align:middle; }
  table.skus td:first-child{ width:44%; word-break:break-word; }
  table.skus td:nth-child(2){ width:16%; }
  table.skus td:nth-child(3){ width:40%; }
  select.comment-select{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:var(--r-md); font-family:'Inter',sans-serif; font-size:12px; background:var(--canvas); color:var(--ink); }
  select.comment-select:focus{ outline:none; border-color:var(--nivea); background:#fff; }
  .saved-note{ font-size:10.5px; margin-top:3px; display:block; }

  .config-warning{ font-size:11.5px; color:var(--red); background:#FBEAE8; padding:8px 10px; border-radius:var(--r-sm); margin:8px 20px; }
</style>
</head>

const RETAILER_PREFIX = {
  CV:'Cruz Verde', SB:'SalcoBrand', FA:'Ahumada',
  LD:'Líder', J:'Jumbo', UN:'Unimarc',
  PU:'Preunic', MA:'Maicao', N:'Sin identificar'
};
function getRetailer(r){
  const m = r.codigo.match(/^[A-Za-z]+/);
  const prefix = m ? m[0] : r.codigo;
  return RETAILER_PREFIX[prefix] || 'Otro';
}

  "Si Exhibido - No reconocido",
  "Se Solicito Ajuste",

  "Se mejoró visibilidad (Tester, POP, cartelería que interrumpe la visualización)",
  "No se Tomo Foto",
];

const WEEKS = [
  {key:'Week 4', label:'Semana 4', tag:'Julio'},
{key:'Week 5', label:'Semana 5', tag:'Julio'},
];
let currentWeek = 'Week 5';
let currentView = 'gerencial'; // 'gerencial' | 'top10'
let state = {level:'nacional', supervisor:null, storeCode:null, chain:null};
let comments = {}; // {codigo: {sku: texto}}
let filterClasif = 'all'; // 'all' | 'Innovación' | 'Sea Salt'

function setFilterClasif(v){ filterClasif = v; refresh(); }
window.setFilterClasif = setFilterClasif;

// Regla de negocio: Innovación = MSL, Gold = Sea Salt (son la misma clasificación
// nombrada distinto en dos columnas del archivo fuente). Usamos "Tipo" como base
// y lo mostramos con el nombre "Sea Salt" en vez de "Gold".
function clasifOf(it){ return it.tipo === 'Innovación' ? 'Innovación' : 'Sea Salt'; }

function filterItems(items){
  return items.filter(it => filterClasif==='all' || clasifOf(it)===filterClasif);
}

function esc(s){ return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function fmt1(n){ return n===null||n===undefined ? '—' : n.toFixed(1); }

function getIncidents(r, week){
  const items = (r.incidents_by_week && r.incidents_by_week[week]) || null;
  if(!items) return null;
  const filtered = filterItems(items);
  return filtered.length ? filtered : null;
}

function weekRecords(){
  return RECORDS.filter(r => getIncidents(r, currentWeek) !== null);
}
function visibleRecords(){
  return weekRecords().filter(r=>{
    if(state.supervisor && r.supervisor !== state.supervisor) return false;
    if(state.chain && getRetailer(r) !== state.chain) return false;
    return true;
  });
}

// ---------------- View tabs ----------------
function renderViewTabs(){
  const el = document.getElementById('viewTabs');
  el.innerHTML = `
    <button class="${currentView==='gerencial'?'active':''}" onclick="setView('gerencial')">Vista Gerencial</button>
    <button class="${currentView==='top10'?'active':''}" onclick="setView('top10')">Top 10 Peores</button>
  `;
}
function setView(v){ currentView = v; refresh(); }

// ---------------- Week selector ----------------
function renderWeekSel(){
  const el = document.getElementById('weekSel');
  el.innerHTML = WEEKS.map(w=>`<button class="${w.key===currentWeek?'active':''}" onclick="setWeek('${w.key}')">${w.label} <span style="opacity:.6;">${w.tag}</span></button>`).join('');
}
function setWeek(k){ currentWeek = k; refresh(); }

// ---------------- Breadcrumb ----------------
function renderBreadcrumb(){
  const el = document.getElementById('breadcrumb');
  if(currentView==='top10'){ el.innerHTML = 'Top 10 salas con más incidentes de Backstock'; return; }
  let parts = [`<span onclick="goNacional()">Nacional</span>`];
  if(state.supervisor) parts.push(`<span onclick="goSupervisor('${esc(state.supervisor)}')">${state.supervisor}</span>`);
  if(state.chain) parts.push(`<span onclick="goChain('${esc(state.chain)}')">${state.chain}</span>`);
  if(state.storeCode) parts.push(`${state.storeCode}`);
  el.innerHTML = parts.join(' › ');
}

// ---------------- KPIs ----------------
function renderKPIs(){
  const el = document.getElementById('kpiRow');
  const recs = currentView==='top10' ? weekRecords() : visibleRecords();
  const totalIncidentes = recs.reduce((s,r)=> s + getIncidents(r,currentWeek).length, 0);
  const salasAfectadas = recs.length;

  const bySup = {};
  recs.forEach(r=>{ bySup[r.supervisor] = (bySup[r.supervisor]||0) + getIncidents(r,currentWeek).length; });
  let worstSup = '—', worstSupN = 0;
  Object.entries(bySup).forEach(([s,n])=>{ if(n>worstSupN){ worstSup=s; worstSupN=n; } });

  const bySku = {};
  recs.forEach(r=> getIncidents(r,currentWeek).forEach(it=>{ bySku[it.sku] = (bySku[it.sku]||0)+1; }));
  let worstSku = '—', worstSkuN = 0;
  Object.entries(bySku).forEach(([s,n])=>{ if(n>worstSkuN){ worstSku=s; worstSkuN=n; } });

  el.innerHTML = `
    <div class="kpi-card"><div class="kpi-label">Incidentes de Backstock</div><div class="kpi-value" style="color:var(--red);">${totalIncidentes}</div></div>
    <div class="kpi-card"><div class="kpi-label">Salas afectadas</div><div class="kpi-value">${salasAfectadas}</div></div>
    <div class="kpi-card"><div class="kpi-label">Supervisor con más incidentes</div><div class="kpi-value" style="font-size:15px;">${worstSup} <span style="color:var(--muted);font-size:12px;">(${worstSupN})</span></div></div>
    <div class="kpi-card"><div class="kpi-label">Producto más repetido</div><div class="kpi-value" style="font-size:13px;">${worstSku} <span style="color:var(--muted);font-size:12px;">(${worstSkuN})</span></div></div>
  `;
}

function renderClientesRanking(){

function saveSkuComment(codigo, sku, rowId){
  const r = RECORDS.find(x=>x.codigo===codigo);
  const select = document.getElementById(rowId);
  const texto = select.value;
  const note = document.getElementById(rowId + '_note');

  if(!comments[codigo]) comments[codigo] = {};
  comments[codigo][sku] = texto;

  if(!texto){ note.textContent=''; note.style.opacity=0; return; }

  if(!GOOGLE_SCRIPT_URL){
    note.textContent = 'Falta configurar Google Apps Script para Cosmetics';
    note.style.color = '#C0392B';
    note.style.opacity = 1;
    setTimeout(()=>{ note.style.opacity = 0; }, 3500);
    return;
  }

  note.textContent = 'Guardando…';
  note.style.color = '#5B6B7C';
  note.style.opacity = 1;

  fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ codigo: r.codigo, supervisor: r.supervisor, sku: sku, comentario: texto })
  }).then(()=>{
    note.textContent = 'Guardado ✓';
    note.style.color = '#158A4A';
    setTimeout(()=>{ note.style.opacity = 0; }, 1800);
  }).catch(()=>{
    note.textContent = 'No se pudo enviar (revisa tu conexión)';
    note.style.color = '#C0392B';
    setTimeout(()=>{ note.style.opacity = 0; }, 3500);
  });
}

// ---------------- Comentarios: carga y resumen colapsable ----------------
let commentsLoaded = false; // false | true | 'error'
let allCommentRows = [];

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

async function loadCommentsSummary(){
  const body = document.getElementById('commentsSummaryBody');
  if(!body) return;
  if(!COMMENTS_SHEET_CSV_URL){ commentsLoaded = 'error'; renderCommentsSummaryBlock(); return; }
  try{
    const res = await fetch(COMMENTS_SHEET_CSV_URL, {cache:'no-store'});
    const text = await res.text();
    const rows = parseCSV(text).filter(r => r.length && r.some(v=>v.trim()!==''));
    if(!rows.length) throw new Error('vacio');
    const header = rows[0].map(h=>h.trim().toLowerCase());
    const idxComentario = header.findIndex(h=>h==='comentario');
    const idxSala = header.findIndex(h=>h==='sala');
    const idxSupervisor = header.findIndex(h=>h==='supervisor');
    const idxSku = header.findIndex(h=>h==='sku');
    allCommentRows = [];
    for(let i=1;i<rows.length;i++){
      const val = (rows[i][idxComentario]||'').trim();
      if(!val) continue;
      allCommentRows.push({
        sala: idxSala>=0 ? (rows[i][idxSala]||'').trim() : '',
        supervisor: idxSupervisor>=0 ? (rows[i][idxSupervisor]||'').trim() : '',
        sku: idxSku>=0 ? (rows[i][idxSku]||'').trim() : '',
        comentario: val
      });
    }
    commentsLoaded = true;
  } catch(e){
    commentsLoaded = 'error';
  }
  renderCommentsSummaryBlock();
  if(skuDetailOpen) renderSkuPerformanceBlock();
}

function computeCommentsTally(){
  let rows = allCommentRows;
  if(state.supervisor){
    rows = rows.filter(c=>{
      const rec = RECORDS.find(r=>r.codigo===c.sala);
      return rec && rec.supervisor === state.supervisor;
    });
  }
  const counts = {}; STANDARD_COMMENTS.forEach(c=>counts[c]=0);
  let total=0, other=0;
  rows.forEach(c=>{
    total++;
    if(counts.hasOwnProperty(c.comentario)) counts[c.comentario]++; else other++;
  });
  return {counts, other, total};
}
function commentsScopeLabel(){
  if(state.supervisor) return `de ${state.supervisor}`;
  return 'de toda la operación';
}

function renderCommentsSummaryBlock(){
  const body = document.getElementById('commentsSummaryBody');
  const titleEl = document.getElementById('commentsSummaryTitle');
  if(!body) return;
  if(titleEl) titleEl.textContent = `Qué se repite más — ${commentsScopeLabel()}`;

  if(!COMMENTS_SHEET_CSV_URL){
    body.innerHTML = `<div class="insight-empty">Falta configurar la hoja de Google de comentarios para Cosmetics (COMMENTS_SHEET_CSV_URL vacío).</div>`;
    return;
  }
  if(!commentsLoaded){ body.innerHTML = `<div class="insight-empty">Cargando comentarios…</div>`; return; }
  if(commentsLoaded==='error'){ body.innerHTML = `<div class="insight-empty">No se pudo cargar el resumen de comentarios.</div>`; return; }

  const {counts, other, total} = computeCommentsTally();
  if(total===0){ body.innerHTML = `<div class="insight-empty">Sin comentarios registrados ${commentsScopeLabel()}.</div>`; return; }

  const entries = Object.entries(counts).filter(([,n])=>n>0);
  if(other>0) entries.push(['Otro / no estandarizado', other]);
  entries.sort((a,b)=>b[1]-a[1]);
  const rowsHtml = entries.map(([label,count])=>{
    const pct = Math.round(count/total*100);
    return `<li class="comment-list-row"><span>${label}</span><span class="comment-list-cnt">${count} · ${pct}%</span></li>`;
  }).join('');

  body.innerHTML = `
    <details class="comment-details">
      <summary>Ver comentarios más frecuentes (${total} en total)</summary>
      <ul class="comment-list">${rowsHtml}</ul>
    </details>
  `;
}

function renderInsightsCol(){
  const el = document.getElementById('insightsCol');
  if(!el) return;
  el.innerHTML = `
    <div class="insight-block">
      <h3>Productos con más backstock</h3>
      <p class="sub">Ranking por N° de incidentes, en la vista actual — click para ver el detalle</p>
      <div id="skuPerfBody"></div>

function refresh(){
  document.getElementById('topBadge').textContent = WEEKS.find(w=>w.key===currentWeek).tag;
  renderViewTabs();
  renderWeekSel();
  renderBreadcrumb();
  renderKPIs();
  renderClientesRanking();

  document.getElementById('gerencialBody').style.display = currentView==='gerencial' ? 'grid' : 'none';
  document.getElementById('top10Body').style.display = currentView==='top10' ? 'grid' : 'none';

  if(currentView==='gerencial'){
    renderInsightsCol();
    if(state.level==='nacional') renderSideNacional();
    else if(state.level==='supervisor') renderSideSupervisor();
    else if(state.level==='chain') renderSideChain();
    else if(state.level==='store') renderSideStore();
  } else {
    renderTop10();
  }
}

refresh();
