<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backstock Tracker — Nivea Chile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --nivea:#0057A8; --nivea-deep:#00294F; --nivea-mid:#0A3D73; --nivea-light:#E6F1FB;
  --ink:#0B1C2C; --muted:#5B6B7C; --faint:#8698A8;
  --paper:#FFFFFF; --canvas:#EEF3F9; --line:#DCE6F0; --mist:#E7EFF8;
  --green:#158A4A; --green-bg:#EAF3DE;
  --red:#C0392B; --red-bg:#FCEBEB;
  --back:#B8620A; --back-bg:#FFF3E0;
  --innov:#8E2A9E; --innov-bg:#F3E6F7;
  --gold:#A67C00; --gold-bg:#FBF3DA;
  --silver:#5B6B7C; --silver-bg:#EAEDF0;
  --bronze:#8A5A2E; --bronze-bg:#F3E9DE;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --sh-sm:0 1px 3px rgba(10,27,46,.07);
  --sh-md:0 4px 16px rgba(10,27,46,.09);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{
  font-family:'Inter',sans-serif;
  background:var(--canvas);
  color:var(--ink);
  font-size:12px;
  overflow-x:hidden;
  max-width:100vw;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}

.topbar{
  background:linear-gradient(135deg, var(--nivea-deep) 0%, var(--nivea-mid) 100%);
  padding:.6rem 1.4rem;
  display:flex;align-items:center;gap:1rem;
  position:sticky;top:0;z-index:200;
  box-shadow:0 4px 20px rgba(10,27,46,.18);
}
.topbar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--nivea-mid),var(--back),var(--nivea-mid));
}
.tb-brand{
  color:white;font-family:'Space Grotesk',sans-serif;
  font-size:15px;font-weight:700;letter-spacing:-.01em;
  padding-right:1.1rem;border-right:1px solid rgba(255,255,255,.18);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px;
}
.tb-brand::before{
  content:'H&S BACKSTOCK TRACKER'; font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;letter-spacing:.14em;color:#A9CDEF;font-weight:500;
}
.tb-right{display:flex;gap:6px;align-items:center;margin-left:auto}
.btn{
  font-family:'Inter',sans-serif;font-size:11px;padding:5px 13px;border-radius:var(--r-sm);
  border:none;cursor:pointer;font-weight:600;
  background:rgba(255,255,255,.15);color:white;transition:background .15s;letter-spacing:.01em;
}
.btn:hover{background:rgba(255,255,255,.28)}

.period-pill{display:flex;background:rgba(255,255,255,.12);border-radius:20px;padding:3px;border:1px solid rgba(255,255,255,.22)}
.period-opt{
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;padding:5px 13px;
  border-radius:18px;cursor:pointer;color:#BFD4E8;transition:all .15s;border:none;background:none;white-space:nowrap;
}
.period-opt.active{background:white;color:var(--nivea-deep)}

/* ---- Managerial filter bar ---- */
.filterbar{
  background:var(--paper);border-bottom:1px solid var(--line);
  padding:.7rem 1.4rem;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;
  position:sticky;top:42px;z-index:199;box-shadow:var(--sh-sm);
}
.f-group{display:flex;flex-direction:column;gap:3px}
.f-label{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.f-select{
  font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;color:var(--ink);
  padding:7px 30px 7px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--canvas) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%235B6B7C"/></svg>') no-repeat right 10px center;
  appearance:none;-webkit-appearance:none;cursor:pointer;min-width:150px;transition:border-color .15s;
}
.f-select:hover, .f-select:focus{border-color:var(--nivea);outline:none}
.f-select.innov-active{border-color:var(--innov);color:var(--innov)}
.search-wrap{position:relative;flex:1;min-width:220px;max-width:320px}
.search-input{
  width:100%;font-family:'Inter',sans-serif;font-size:11.5px;
  padding:7.5px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  outline:none;color:var(--ink);background:var(--canvas);
  transition:border-color .15s,background .15s;
}
.search-input:focus{border-color:var(--nivea);background:white}
.search-drop{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  background:white;border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--sh-md);max-height:320px;overflow-y:auto;z-index:250;display:none;
}
.search-drop.show{display:block}
.search-item{
  padding:7px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  border-bottom:.5px solid var(--mist);font-size:11px;
}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:var(--nivea-light)}
.si-code{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--nivea-deep)}
.si-sub{font-size:9.5px;color:var(--faint);font-family:'IBM Plex Mono',monospace}
.clear-btn{
  font-family:'Inter',sans-serif;font-size:11px;font-weight:600;padding:7.5px 14px;
  border-radius:var(--r-sm);border:1px solid var(--line);background:white;color:var(--muted);cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.clear-btn:hover{border-color:var(--red);color:var(--red)}
.active-filters{
  font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--nivea);font-weight:600;
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
}

.page{max-width:1200px;margin:.9rem auto;padding:0 1.2rem}
.info-banner{
  background:var(--nivea-light);border:1px solid var(--nivea);border-radius:var(--r-md);
  padding:.55rem .9rem;margin-bottom:.75rem;font-size:10.5px;color:var(--nivea-deep);
  display:flex;gap:8px;align-items:flex-start;
}
.info-banner b{font-weight:700}
.ph{
  background:white;border-radius:var(--r-lg);padding:.8rem 1.2rem;margin-bottom:.75rem;
  border-left:4px solid var(--back);display:flex;justify-content:space-between;align-items:flex-start;
  flex-wrap:wrap;gap:8px;box-shadow:var(--sh-sm);
}
.ph-title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;letter-spacing:-.01em}
.ph-sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--faint);margin-top:3px;letter-spacing:.04em}
.ph-badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.badge{
  font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;
  padding:3px 9px;border-radius:20px;letter-spacing:.04em;white-space:nowrap;
}
.b-blue{background:var(--nivea-light);color:var(--nivea)}
.b-dark{background:var(--nivea-deep);color:white}
.b-ok{background:var(--green-bg);color:var(--green)}
.b-warn{background:var(--back-bg);color:var(--back)}
.b-bad{background:var(--red-bg);color:var(--red)}
.b-innov{background:var(--innov-bg);color:var(--innov)}
.nav-btn{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;
  padding:4px 11px;border-radius:20px;border:1px solid var(--line);
  background:white;color:var(--muted);cursor:pointer;transition:all .15s;
}
.nav-btn:hover{border-color:var(--nivea);color:var(--nivea)}
.nav-btn:disabled{opacity:.4;cursor:default}
.nav-btn:disabled:hover{border-color:var(--line);color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:.75rem}
.kpi{
  background:white;border-radius:var(--r-md);padding:.7rem .9rem;
  border:1px solid var(--line);border-left:3px solid var(--line);
  box-shadow:var(--sh-sm);transition:box-shadow .15s,transform .15s;
}
.kpi:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.kpi-lbl{
  font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;color:var(--faint);margin-bottom:4px;
}
.kpi-val{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;letter-spacing:-.01em}
.kpi-sub{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--faint);margin-top:2px;letter-spacing:.03em}

.main{display:flex;gap:.75rem;margin-bottom:.75rem;align-items:flex-start}
.left-col{display:flex;flex-direction:column;gap:.75rem;flex:1;min-width:0}
.rcol{display:flex;flex-direction:column;gap:.75rem;width:280px;flex-shrink:0}
.card{
  background:white;border-radius:var(--r-lg);padding:.85rem 1.1rem;
  border:1px solid var(--line);box-shadow:var(--sh-sm);
}
.sec-lbl{
  font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--faint);margin-bottom:.6rem;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;
}

.toggle-pill{display:flex;background:var(--canvas);border-radius:20px;padding:3px;border:1px solid var(--line)}
.toggle-opt{
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:5px 14px;
  border-radius:18px;cursor:pointer;color:var(--muted);transition:all .15s;border:none;background:none;
}
.toggle-opt.active{background:var(--nivea-deep);color:white}

.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem}
.cat-tab{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  padding:6px 16px;border-radius:20px;border:1px solid var(--line);
  background:white;cursor:pointer;color:var(--muted);transition:all .15s;letter-spacing:.02em;
}
.cat-tab:hover{border-color:var(--nivea);color:var(--nivea)}
.cat-tab.active{background:var(--nivea-deep);color:white;border-color:var(--nivea-deep)}

table.pt{width:100%;border-collapse:collapse;font-size:11px}
table.pt th{
  font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:600;color:var(--faint);
  padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;background:var(--canvas);
  white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;
}
table.pt td{padding:6px 8px;border-bottom:.5px solid var(--mist);vertical-align:middle}
table.pt tr:last-child td{border-bottom:none}
table.pt tr:hover td{background:var(--mist)}
.prod-name{font-size:10.5px;line-height:1.35}
.ean-code{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted)}
.cat-pill{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;
  padding:2px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.02em;
  background:var(--nivea-light);color:var(--nivea-deep);
}
.type-pill{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;
  padding:2px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.02em;
}
.chain-pill{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:700;
  padding:2px 8px;border-radius:20px;white-space:nowrap;letter-spacing:.02em;
  background:var(--nivea-light);color:var(--nivea-deep);
}
.store-link{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--nivea-deep);cursor:pointer}
.store-link:hover{text-decoration:underline}
.ver-link{
  font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;
  padding:3px 10px;border-radius:20px;border:1px solid var(--nivea);
  background:white;color:var(--nivea);cursor:pointer;white-space:nowrap;
  text-decoration:none;display:inline-block;
}
.ver-link:hover{background:var(--nivea);color:white}

.trend-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;white-space:nowrap}
.trend-up{color:var(--red)}
.trend-down{color:var(--green)}
.trend-flat{color:var(--faint)}
.trend-new{color:var(--nivea)}

.rank-row{
  display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:.5px solid var(--mist);
  cursor:pointer;transition:background .1s;
}
.rank-row:hover{background:var(--mist)}
.rank-row:last-child{border-bottom:none}
.rank-pos{
  font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;color:var(--faint);
  width:16px;text-align:center;flex-shrink:0;
}
.rank-code{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:11.5px;color:var(--nivea-deep);width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-sub{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--faint);width:82px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-bar-wrap{flex:1;background:var(--mist);border-radius:20px;height:7px;overflow:hidden}
.rank-bar{height:100%;border-radius:20px;background:var(--back)}
.rank-val{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;width:34px;text-align:right;flex-shrink:0}
.rank-trend{width:70px;text-align:right;flex-shrink:0}

.mini-row{
  display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:.5px solid var(--mist);
  cursor:pointer;transition:background .1s;
}
.mini-row:last-child{border-bottom:none}
.mini-row:hover{background:var(--mist)}
.mini-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;color:var(--ink);width:96px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-bar-wrap{flex:1;background:var(--mist);border-radius:20px;height:6px;overflow:hidden}
.mini-bar{height:100%;border-radius:20px;background:var(--nivea)}
.mini-val{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;width:28px;text-align:right;flex-shrink:0}

.hero{
  background:white;border-radius:var(--r-lg);padding:1.4rem 1.4rem 1.1rem;margin-bottom:.75rem;
  border:1px solid var(--line);box-shadow:var(--sh-sm);text-align:center;
}
.hero-title{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;margin-bottom:.3rem}
.hero-sub{font-size:11.5px;color:var(--muted);max-width:580px;margin:0 auto .9rem}

.empty-hint{text-align:center;padding:2rem 1rem;color:var(--faint);font-size:11.5px}

.footer{
  text-align:center;padding:.7rem;font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;color:var(--faint);margin-top:.3rem;letter-spacing:.04em;
}

@media print{
  .topbar,.filterbar{display:none}
  .page{padding:0;margin:0;max-width:100%}
}
@media(max-width:860px){
  .main{flex-direction:column}
  .rcol{width:100%}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .rank-code{width:76px}
  .rank-sub{width:60px}
  .rank-trend{width:56px}
  .f-select{min-width:120px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-brand">Nivea &middot; Chile</div>
  <div class="tb-right">
    <div class="period-pill" id="period-pill"></div>
    <button class="btn" onclick="window.print()">&#8659; PDF</button>
  </div>
</div>

<div class="filterbar">
  <div class="search-wrap">
    <div class="f-label">Buscar</div>
    <input type="text" class="search-input" id="search-input" placeholder="Supervisor, local o producto..." autocomplete="off" oninput="onSearchInput()" onfocus="onSearchInput()">
    <div class="search-drop" id="search-drop"></div>
  </div>
  <div class="f-group">
    <div class="f-label">Cadena</div>
    <select class="f-select" id="chain-select" onchange="setChainFilter(this.value)"></select>
  </div>
  <div class="f-group">
    <div class="f-label">Categoría</div>
    <select class="f-select" id="cat-select" onchange="setCatFilter(this.value)"></select>
  </div>
  <div class="f-group" id="type-filter-group">
    <div class="f-label">Type</div>
    <select class="f-select" id="type-select" onchange="setTypeFilter(this.value)"></select>
  </div>
  <button class="clear-btn" onclick="clearFilters()">&times; Limpiar filtros</button>
</div>

<div class="page" id="page"></div>

<div class="footer" id="footer"></div>

var PERIODS = ['Semana 3 Julio 2026','Semana 4 Julio 2026'];
var PERIOD_SHORT = {'Semana 3 Julio 2026':'Semana 3','Semana 4 Julio 2026':'Semana 4'};
var LATEST_PERIOD = 'Semana 4 Julio 2026';

var TYPE_STYLE = {
  'Innovación': {color:'var(--innov)', bg:'var(--innov-bg)'},
  'Gold': {color:'var(--gold)', bg:'var(--gold-bg)'},
  'Silver': {color:'var(--silver)', bg:'var(--silver-bg)'},
  'Bronze': {color:'var(--bronze)', bg:'var(--bronze-bg)'},
  'Sin tipo': {color:'var(--faint)', bg:'var(--mist)'}
};

var curPeriod = LATEST_PERIOD;
var curView = 'home';
var homeMode = 'sup';
var detailType = null;
var detailKey = null;
var curCat = 'General';
var curCatFilter = 'ALL';
var curChainFilter = 'ALL';
var curTypeFilter = 'ALL';

function esc(s){ return (s==null? '' : String(s)); }

function periodRecords(period){
  return RECORDS.filter(function(r){ return r.period === period; });
}
function chainsForPeriod(period){
  var s = {}; periodRecords(period).forEach(function(r){ s[r.chain]=true; });
  return Object.keys(s).sort();
}
function catsForPeriod(period){
  var s = {}; periodRecords(period).forEach(function(r){ if(r.cat) s[r.cat]=true; });
  return Object.keys(s).sort();
}
function typesForPeriod(period){
  var s = {}; periodRecords(period).forEach(function(r){ if(r.type) s[r.type]=true; });
  var order = ['Innovación','Gold','Silver','Bronze','Sin tipo'];
  return order.filter(function(t){ return s[t]; });
}

function filteredRecords(){
  return periodRecords(curPeriod).filter(function(r){
    return (curChainFilter === 'ALL' || r.chain === curChainFilter) &&
           (curCatFilter === 'ALL' || r.cat === curCatFilter) &&
           (curTypeFilter === 'ALL' || r.type === curTypeFilter);
  });
}

function groupBy(recs, keyFn){
  var m = {};
  recs.forEach(function(r){
    var k = keyFn(r);
    if (!m[k]) m[k] = [];
    m[k].push(r);
  });
  return m;
}

function supList(){
  var s = {}; RECORDS.forEach(function(r){ s[r.sup] = true; }); return Object.keys(s).sort();
}
function storeList(period){
  var s = {}; periodRecords(period).forEach(function(r){ s[r.store] = true; }); return Object.keys(s).sort();
}
function storeSupervisor(store, period){
  var recs = RECORDS.filter(function(r){ return r.store === store && (!period || r.period===period); });
  var cnt = {};
  recs.forEach(function(r){ cnt[r.sup] = (cnt[r.sup]||0)+1; });
  var best = null, bestN = -1;
  Object.keys(cnt).forEach(function(k){ if (cnt[k] > bestN){ best=k; bestN=cnt[k]; } });
  return best;
}
function storeChain(store){
  var r = RECORDS.find(function(x){ return x.store === store; });
  return r ? r.chain : null;
}
function supervisorStores(sup, period){
  var s = {}; RECORDS.forEach(function(r){ if (r.sup === sup && (!period || r.period===period)) s[r.store] = true; }); return Object.keys(s).sort();
}
function catBreakdown(recs, cats){
  var out = {};
  cats.forEach(function(c){ out[c] = 0; });
  recs.forEach(function(r){ if (r.cat) out[r.cat] = (out[r.cat]||0) + 1; });
  return out;
}

/* ---------------- TREND (W3 -> W4) ---------------- */
function totalForKey(period, mode, key){
  return RECORDS.filter(function(r){
    return r.period === period && (mode === 'sup' ? r.sup === key : r.store === key);
  }).length;
}
function trendInfo(mode, key){
  if (curPeriod !== LATEST_PERIOD) return null;
  var w4 = totalForKey('Semana 4 Julio 2026', mode, key);
  var w3 = totalForKey('Semana 3 Julio 2026', mode, key);
  if (w3 === 0) return {tag:'nuevo'};
  var delta = w4 - w3;
  var pct = Math.round(delta / w3 * 100);
  return {tag: delta<0?'down':delta>0?'up':'flat', delta:delta, pct:pct, w3:w3, w4:w4};
}
function trendHtml(mode, key){
  var t = trendInfo(mode, key);
  if (!t) return '';
  if (t.tag === 'nuevo') return '<span class="trend-tag trend-new">Nuevo</span>';
  if (t.tag === 'flat') return '<span class="trend-tag trend-flat">&#61; sin cambio</span>';
  if (t.tag === 'down') return '<span class="trend-tag trend-down">&#8595; ' + t.delta + ' (' + t.pct + '%)</span>';
  return '<span class="trend-tag trend-up">&#8593; +' + t.delta + ' (+' + t.pct + '%)</span>';
}

function renderPeriodPill(){
  document.getElementById('period-pill').innerHTML = PERIODS.map(function(p){
    return '<button class="period-opt' + (curPeriod===p?' active':'') + '" onclick="setPeriod(\'' + p + '\')">' + PERIOD_SHORT[p] + '</button>';
  }).join('');
}
function setPeriod(p){
  curPeriod = p;
  curChainFilter = 'ALL'; curCatFilter = 'ALL'; curTypeFilter = 'ALL';
  renderPeriodPill();
  goHome();
}

function renderChainFilters(){
  var chains = chainsForPeriod(curPeriod);
  var sel = document.getElementById('chain-select');
  sel.innerHTML = '<option value="ALL">Todas las cadenas</option>' +
    chains.map(function(c){ return '<option value="' + c + '"' + (curChainFilter===c?' selected':'') + '>' + c + '</option>'; }).join('');
  sel.value = curChainFilter;
}
function setChainFilter(c){
  curChainFilter = c;
  if (curView === 'home') renderHome(); else renderDetail();
}
function renderCatFilters(){
  var cats = catsForPeriod(curPeriod);
  var sel = document.getElementById('cat-select');
  sel.innerHTML = '<option value="ALL">Todas las categorías</option>' +
    cats.map(function(c){ return '<option value="' + c + '"' + (curCatFilter===c?' selected':'') + '>' + c + '</option>'; }).join('');
  sel.value = curCatFilter;
}
function setCatFilter(c){
  curCatFilter = c;
  if (curView === 'home') renderHome(); else renderDetail();
}
function renderTypeFilters(){
  var types = typesForPeriod(curPeriod);
  var group = document.getElementById('type-filter-group');
  var sel = document.getElementById('type-select');
  if (!types.length){ group.style.display = 'none'; return; }
  group.style.display = 'flex';
  sel.innerHTML = '<option value="ALL">Todos los types</option>' +
    types.map(function(t){ return '<option value="' + t + '"' + (curTypeFilter===t?' selected':'') + '>' + (t==='Innovación' ? '★ ' : '') + t + '</option>'; }).join('');
  sel.value = curTypeFilter;
  sel.classList.toggle('innov-active', curTypeFilter === 'Innovación');
}
function setTypeFilter(t){
  curTypeFilter = t;
  document.getElementById('type-select').classList.toggle('innov-active', t === 'Innovación');
  if (curView === 'home') renderHome(); else renderDetail();
}
function clearFilters(){
  curChainFilter = 'ALL'; curCatFilter = 'ALL'; curTypeFilter = 'ALL';
  renderChainFilters(); renderCatFilters(); renderTypeFilters();
  if (curView === 'home') renderHome(); else renderDetail();
}

function onSearchInput(){
  var q = document.getElementById('search-input').value.trim().toUpperCase();
  var drop = document.getElementById('search-drop');
  if (!q){ drop.classList.remove('show'); drop.innerHTML=''; return; }

  var supMatches = supList().filter(function(s){ return s.toUpperCase().indexOf(q) >= 0; }).slice(0,6);
  var storeMatches = {};
  RECORDS.forEach(function(r){
    if (r.store.toUpperCase().indexOf(q) >= 0) storeMatches[r.store + '||' + r.period] = r;
  });
  var storeArr = Object.values(storeMatches).slice(0,8);

  var html = '';
  supMatches.forEach(function(s){
    var n = periodRecords(curPeriod).filter(function(r){ return r.sup === s; }).length;
    html += '<div class="search-item" onclick="goDetail(\'sup\',\'' + s.replace(/'/g,"\\'") + '\')">' +
      '<span class="si-code">' + s + '</span><span class="si-sub">Supervisor &middot; ' + n + ' casos (' + PERIOD_SHORT[curPeriod] + ')</span></div>';
  });
  storeArr.forEach(function(r){
    var n = RECORDS.filter(function(x){ return x.store === r.store && x.period === r.period; }).length;
    html += '<div class="search-item" onclick="goDetail(\'store\',\'' + r.store + '\',\'' + r.period + '\')">' +
      '<span class="si-code">' + r.store + '</span><span class="si-sub">' + r.chain + ' &middot; ' + PERIOD_SHORT[r.period] + ' &middot; ' + n + ' casos</span></div>';
  });
  if (!html){ drop.classList.remove('show'); drop.innerHTML=''; return; }
  drop.innerHTML = html;
  drop.classList.add('show');
}
document.addEventListener('click', function(e){
  if (!e.target.closest('.search-wrap')) {
    document.getElementById('search-drop').classList.remove('show');
  }
});

function goDetail(type, key, period){
  detailType = type;
  detailKey = key;
  curCat = 'General';
  curView = 'detail';
  if (period && period !== curPeriod){
    curPeriod = period;
    curChainFilter='ALL'; curCatFilter='ALL'; curTypeFilter='ALL';
    renderPeriodPill(); renderChainFilters(); renderCatFilters(); renderTypeFilters();
  }
  document.getElementById('search-input').value = '';
  document.getElementById('search-drop').classList.remove('show');
  renderDetail();
}
function goHome(){
  curView = 'home';
  renderChainFilters(); renderCatFilters(); renderTypeFilters();
  renderHome();
}
function setHomeMode(m){
  homeMode = m;
  renderHome();
}

/* ---------------- HOME ---------------- */
function renderHome(){
  var recs = filteredRecords();
  var totalCases = recs.length;
  var nSup = Object.keys(groupBy(recs, function(r){return r.sup;})).length;
  var nStore = Object.keys(groupBy(recs, function(r){return r.store;})).length;
  var eanSet = {};
  recs.forEach(function(r){ eanSet[r.ean || ('NAME::'+r.prod)] = true; });
  var nSku = Object.keys(eanSet).length;

  var kpisHtml =
    '<div class="kpi" style="border-left-color:var(--back)"><div class="kpi-lbl">Casos de Backstock</div>' +
      '<div class="kpi-val" style="color:var(--back)">' + totalCases + '</div><div class="kpi-sub">Stock en sistema, sin foto</div></div>' +
    '<div class="kpi" style="border-left-color:var(--nivea)"><div class="kpi-lbl">Supervisores afectados</div>' +
      '<div class="kpi-val">' + nSup + '</div><div class="kpi-sub">de ' + supList().length + ' totales</div></div>' +
    '<div class="kpi" style="border-left-color:var(--nivea)"><div class="kpi-lbl">Locales afectados</div>' +
      '<div class="kpi-val">' + nStore + '</div><div class="kpi-sub">de ' + storeList(curPeriod).length + ' totales</div></div>' +
    '<div class="kpi" style="border-left-color:var(--green)"><div class="kpi-lbl">SKU únicos</div>' +
      '<div class="kpi-val">' + nSku + '</div><div class="kpi-sub">productos distintos en backstock</div></div>';

  var rankGroups = groupBy(recs, function(r){ return homeMode === 'sup' ? r.sup : r.store; });
  var ranked = Object.keys(rankGroups).map(function(k){
    var g = rankGroups[k];
    var sub = homeMode==='sup' ? (supervisorStores(k, curPeriod).length + ' locales') : storeChain(k);
    return {key:k, count:g.length, sub: sub};
  }).sort(function(a,b){ return b.count - a.count; }).slice(0,14);
  var maxCount = ranked.length ? ranked[0].count : 1;

  var rankHtml = ranked.map(function(r, i){
    var w = Math.round(r.count/maxCount*100);
    return '<div class="rank-row" onclick="goDetail(\'' + homeMode + '\',\'' + r.key.replace(/'/g,"\\'") + '\')">' +
      '<div class="rank-pos">' + (i+1) + '</div>' +
      '<div class="rank-code" title="' + r.key + '">' + r.key + '</div>' +
      '<div class="rank-sub" title="' + r.sub + '">' + r.sub + '</div>' +
      '<div class="rank-bar-wrap"><div class="rank-bar" style="width:' + w + '%"></div></div>' +
      '<div class="rank-val" style="color:var(--back)">' + r.count + '</div>' +
      '<div class="rank-trend">' + trendHtml(homeMode, r.key) + '</div></div>';
  }).join('');

  var cats = catsForPeriod(curPeriod);
  var catBk = catBreakdown(recs, cats);
  var catMax = Math.max.apply(null, cats.map(function(c){ return catBk[c]||0; }).concat([1]));
  var catCardsHtml = cats.slice().sort(function(a,b){ return (catBk[b]||0)-(catBk[a]||0); }).map(function(c){
    var n = catBk[c] || 0;
    var w = Math.round(n/catMax*100);
    return '<div class="mini-row" onclick="setCatFilter(\'' + c + '\');renderCatFilters()">' +
      '<div class="mini-label" title="' + c + '">' + c + '</div>' +
      '<div class="mini-bar-wrap"><div class="mini-bar" style="width:' + w + '%"></div></div>' +
      '<div class="mini-val">' + n + '</div></div>';
  }).join('');

  var chains = chainsForPeriod(curPeriod);
  var chainCounts = chains.map(function(c){ return recs.filter(function(r){ return r.chain === c; }).length; });
  var chainMax = Math.max.apply(null, chainCounts.concat([1]));
  var chainCardsHtml = chains.map(function(c,i){ return {c:c, n:chainCounts[i]}; })
    .sort(function(a,b){ return b.n - a.n; }).map(function(o){
    var w = Math.round(o.n/chainMax*100);
    return '<div class="mini-row" onclick="setChainFilter(\'' + o.c + '\');renderChainFilters()">' +
      '<div class="mini-label" title="' + o.c + '">' + o.c + '</div>' +
      '<div class="mini-bar-wrap"><div class="mini-bar" style="width:' + w + '%"></div></div>' +
      '<div class="mini-val">' + o.n + '</div></div>';
  }).join('');

  var prodGroups = groupBy(recs, function(r){ return r.ean || ('NAME::'+r.prod); });
  var topProds = Object.keys(prodGroups).map(function(k){
    var g = prodGroups[k];
    var stores = {};
    g.forEach(function(r){ stores[r.store] = true; });
    return {name:g[0].prod, cat:g[0].cat, ean:g[0].ean, type:g[0].type, img:g[0].img, count:g.length, nStores: Object.keys(stores).length};
  }).sort(function(a,b){ return b.count - a.count; }).slice(0,8);

  var topProdRows = topProds.map(function(p){
    var typeStyle = p.type ? (TYPE_STYLE[p.type] || {color:'var(--muted)',bg:'var(--mist)'}) : null;
    return '<tr><td class="prod-name">' + p.name + '<br><span class="ean-code">' + (p.ean || 'Sin EAN') + '</span></td>' +
      '<td>' + (p.cat ? '<span class="cat-pill">' + p.cat + '</span>' : '<span style="color:var(--faint)">&mdash;</span>') + '</td>' +
      '<td>' + (typeStyle ? '<span class="type-pill" style="background:' + typeStyle.bg + ';color:' + typeStyle.color + '">' + (p.type==='Innovación'?'&#9733; ':'') + p.type + '</span>' : '<span style="color:var(--faint)">&mdash;</span>') + '</td>' +
      '<td style="text-align:center;font-weight:700;color:var(--back)">' + p.count + '</td>' +
      '<td style="text-align:center;color:var(--muted)">' + p.nStores + '</td>' +
      '<td>' + (p.img ? '<a class="ver-link" href="' + p.img + '" target="_blank" rel="noopener">Ver &#8599;</a>' : '') + '</td></tr>';
  }).join('');

  var toggleHtml =
    '<div class="toggle-pill">' +
      '<button class="toggle-opt' + (homeMode==='sup'?' active':'') + '" onclick="setHomeMode(\'sup\')">Por Supervisor</button>' +
      '<button class="toggle-opt' + (homeMode==='store'?' active':'') + '" onclick="setHomeMode(\'store\')">Por Local</button>' +
    '</div>';

  var trendNote = curPeriod === LATEST_PERIOD
    ? '<div class="info-banner"><span>&#8505;</span><span>La columna de tendencia compara contra <b>Semana 3</b>. Si un supervisor o local dice <b>"Nuevo"</b>, es porque no tenía casos registrados esa semana.</span></div>'
    : '';

  document.getElementById('page').innerHTML =
    trendNote +
    '<div class="hero">' +
      '<div class="hero-title">Backstock Tracker &mdash; Nivea Chile</div>' +
      '<div class="hero-sub">Producto con stock en sistema pero ausente en la foto de góndola. Prioriza los supervisores y locales con más casos, y revisa si subieron o bajaron respecto a la semana anterior.</div>' +
    '</div>' +
    '<div class="kpis">' + kpisHtml + '</div>' +
    '<div class="main">' +
      '<div class="left-col">' +
        '<div class="card">' +
          '<div class="sec-lbl"><span>Ranking de mayor oportunidad</span>' + toggleHtml + '</div>' +
          (rankHtml || '<div class="empty-hint">Sin casos para este filtro.</div>') +
        '</div>' +
      '</div>' +
      '<div class="rcol">' +
        '<div class="card"><div class="sec-lbl">Casos por cadena</div>' +
          '<div>' + chainCardsHtml + '</div>' +
        '</div>' +
        '<div class="card"><div class="sec-lbl">Casos por categoría</div>' +
          '<div>' + catCardsHtml + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="sec-lbl">Productos recurrentes &middot; mismo SKU en múltiples locales</div>' +
      '<table class="pt"><thead><tr><th>Producto</th><th style="width:90px">Categoría</th><th style="width:90px">Type</th><th style="width:60px;text-align:center">Casos</th><th style="width:70px;text-align:center">Locales</th><th style="width:60px"></th></tr></thead>' +
      '<tbody>' + topProdRows + '</tbody></table>' +
    '</div>';

  document.getElementById('footer').textContent =
    'Backstock Tracker · Nivea Chile · ' + PERIOD_SHORT[curPeriod] + ' · ' + totalCases + ' casos · ' +
    new Date().toLocaleDateString('es-CL',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

/* ---------------- DETAIL (Supervisor or Store) ---------------- */
function catMixBar(recs, cats){
  var bk = catBreakdown(recs, cats);
  var total = recs.length || 1;
  var palette = ['var(--nivea)','var(--innov)','var(--green)','var(--back)','var(--gold)','var(--red)','var(--silver)','var(--bronze)'];
  var html = '<div style="display:flex;height:22px;border-radius:6px;overflow:hidden;margin-bottom:6px;box-shadow:inset 0 0 0 1px var(--line)">';
  cats.forEach(function(c, i){
    var v = (bk[c]||0) / total;
    if (v <= 0) return;
    var w = Math.round(v*1000)/10;
    var color = palette[i % palette.length];
    html += '<div style="width:' + w + '%;background:' + color + ';display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;font-family:\'IBM Plex Mono\',monospace;color:white;overflow:hidden" title="' + c + ': ' + (bk[c]||0) + '">' + (w>=8 ? (bk[c]||0) : '') + '</div>';
  });
  html += '</div>';
  var legend = '<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:9.5px;color:var(--muted)">' + cats.map(function(c,i){
    return '<span style="display:flex;align-items:center;gap:4px;font-family:\'IBM Plex Mono\',monospace;font-weight:500"><span style="width:8px;height:8px;border-radius:2px;background:' + palette[i%palette.length] + '"></span>' + c + '</span>';
  }).join('') + '</div>';
  return html + legend;
}

function renderDetail(){
  var isSup = detailType === 'sup';
  var baseRecs = RECORDS.filter(function(r){ return r.period === curPeriod && (isSup ? r.sup === detailKey : r.store === detailKey); });
  var allRecsForKey = baseRecs.filter(function(r){
    return (curChainFilter === 'ALL' || r.chain === curChainFilter) &&
           (curTypeFilter === 'ALL' || r.type === curTypeFilter);
  });
  var recs = curCat === 'General' ? allRecsForKey : allRecsForKey.filter(function(r){ return r.cat === curCat; });

  var relatedStores = isSup ? supervisorStores(detailKey, curPeriod) : [detailKey];
  var relatedChains = isSup ? Object.keys(groupBy(baseRecs, function(r){return r.chain;})) : [storeChain(detailKey)];

  var t = trendInfo(isSup?'sup':'store', detailKey);
  var trendBadgeHtml = '';
  if (t){
    if (t.tag==='nuevo') trendBadgeHtml = '<span class="badge b-blue">Nuevo esta semana</span>';
    else if (t.tag==='flat') trendBadgeHtml = '<span class="badge b-blue">Sin cambio vs S3</span>';
    else if (t.tag==='down') trendBadgeHtml = '<span class="badge b-ok">&#8595; ' + t.delta + ' vs S3 (' + t.pct + '%)</span>';
    else trendBadgeHtml = '<span class="badge b-bad">&#8593; +' + t.delta + ' vs S3 (+' + t.pct + '%)</span>';
  }

  var badges = '<span class="badge b-dark">' + (isSup ? 'Supervisor' : 'Local') + '</span>' +
    '<span class="badge b-warn">' + allRecsForKey.length + ' casos backstock</span>' +
    trendBadgeHtml +
    relatedChains.map(function(c){ return '<span class="badge b-blue">' + c + '</span>'; }).join('');

  var navList = isSup ? supList() : storeList(curPeriod);
  var idx = navList.indexOf(detailKey);

  document.getElementById('page').innerHTML =
    '<div class="ph">' +
      '<div><div class="ph-title">' + detailKey + '</div><div class="ph-sub">' + (isSup ? ('Supervisor · ' + relatedStores.length + ' locales a cargo · ' + PERIOD_SHORT[curPeriod]) : ('Local · ' + storeChain(detailKey) + ' · Supervisor: ' + storeSupervisor(detailKey, curPeriod) + ' · ' + PERIOD_SHORT[curPeriod])) + '</div></div>' +
      '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">' +
        '<div class="ph-badges">' + badges + '</div>' +
        '<div style="display:flex;gap:5px">' +
          '<button class="nav-btn" onclick="goHome()">&larr; Inicio</button>' +
          '<button class="nav-btn" onclick="stepDetail(-1)"' + (idx<=0?' disabled':'') + '>&larr; Anterior</button>' +
          '<button class="nav-btn" onclick="stepDetail(1)"' + (idx>=navList.length-1?' disabled':'') + '>Siguiente &rarr;</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="kpis" id="kpis"></div>' +
    '<div class="cat-tabs" id="cat-tabs"></div>' +
    '<div id="cat-body"></div>' +
    '<div class="footer">Backstock Tracker · ' + detailKey + ' · ' + PERIOD_SHORT[curPeriod] + '</div>';

  window._navList = navList;

  renderDetailKpis(allRecsForKey, relatedStores);
  renderDetailCatTabs();
  renderDetailBody(recs, allRecsForKey, isSup);
}

function stepDetail(dir){
  var list = window._navList;
  var idx = list.indexOf(detailKey) + dir;
  if (idx < 0 || idx >= list.length) return;
  goDetail(detailType, list[idx]);
}

function renderDetailKpis(allRecs, stores){
  var cats = catsForPeriod(curPeriod);
  var bk = catBreakdown(allRecs, cats);
  var topCats = cats.slice(0,3);
  var kpis = [
    {lbl:'Total Backstock', val: allRecs.length, c:'var(--back)'},
    {lbl:'Locales', val: stores.length, c:'var(--nivea)'}
  ];
  topCats.forEach(function(c){ kpis.push({lbl:c, val: bk[c]||0, c:'var(--nivea)'}); });
  document.getElementById('kpis').innerHTML = kpis.map(function(k){
    return '<div class="kpi" style="border-left-color:' + k.c + '"><div class="kpi-lbl">' + k.lbl + '</div>' +
      '<div class="kpi-val" style="color:' + k.c + '">' + k.val + '</div></div>';
  }).join('');
}

function renderDetailCatTabs(){
  var tabs = ['General'].concat(catsForPeriod(curPeriod));
  document.getElementById('cat-tabs').innerHTML = tabs.map(function(t){
    return '<button class="cat-tab' + (curCat===t?' active':'') + '" onclick="setDetailCat(\'' + t + '\')">' + t + '</button>';
  }).join('');
}
function setDetailCat(c){
  curCat = c;
  renderDetailCatTabs();
  renderDetail();
}

function productTableHtml(recs, isSup){
  if (!recs.length) return '<div class="empty-hint">Sin productos en backstock para este filtro.</div>';
  var sorted = recs.slice().sort(function(a,b){
    if (a.store !== b.store) return a.store < b.store ? -1 : 1;
    return a.prod < b.prod ? -1 : 1;
  });
  var rows = sorted.map(function(r){
    var storeCell = isSup
      ? '<span class="store-link" onclick="goDetail(\'store\',\'' + r.store + '\')">' + r.store + '</span>'
      : r.store;
    var typeStyle = r.type ? (TYPE_STYLE[r.type] || {color:'var(--muted)',bg:'var(--mist)'}) : null;
    return '<tr><td class="prod-name">' + r.prod + '</td>' +
      '<td class="ean-code">' + (r.ean || '—') + '</td>' +
      '<td>' + (r.cat ? '<span class="cat-pill">' + r.cat + '</span>' : '<span style="color:var(--faint)">&mdash;</span>') + '</td>' +
      '<td>' + (typeStyle ? '<span class="type-pill" style="background:' + typeStyle.bg + ';color:' + typeStyle.color + '">' + (r.type==='Innovación'?'&#9733; ':'') + r.type + '</span>' : '<span style="color:var(--faint)">&mdash;</span>') + '</td>' +
      (isSup ? '<td><span class="chain-pill">' + r.chain + '</span></td>' : '') +
      '<td>' + storeCell + '</td>' +
      '<td>' + (r.img ? '<a class="ver-link" href="' + r.img + '" target="_blank" rel="noopener">Ver &#8599;</a>' : '') + '</td></tr>';
  }).join('');
  var chainHeader = isSup ? '<th style="width:80px">Cadena</th>' : '';
  return '<table class="pt"><thead><tr><th>Producto</th><th style="width:100px">EAN</th><th style="width:90px">Categoría</th><th style="width:90px">Type</th>' + chainHeader + '<th style="width:70px">Local</th><th style="width:60px"></th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderDetailBody(recs, allRecsForKey, isSup){
  var body = document.getElementById('cat-body');

  var storesBlock = '';
  if (isSup){
    var stores = supervisorStores(detailKey, curPeriod);
    if (curChainFilter !== 'ALL') stores = stores.filter(function(s){ return storeChain(s) === curChainFilter; });
    storesBlock = '<div class="card" style="margin-bottom:.75rem">' +
      '<div class="sec-lbl">Locales a cargo &middot; ' + PERIOD_SHORT[curPeriod] + '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
      stores.map(function(s){
        var n = allRecsForKey.filter(function(r){ return r.store===s; }).length;
        return '<span class="cbtn" style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;font-weight:600;padding:4px 14px;border-radius:20px;border:1px solid var(--line);cursor:pointer;color:var(--muted)" onclick="goDetail(\'store\',\'' + s + '\')">' + s + ' (' + storeChain(s) + ') &middot; ' + n + '</span>';
      }).join('') +
      '</div></div>';
  }

  var cats = catsForPeriod(curPeriod);

  body.innerHTML =
    storesBlock +
    '<div class="card" style="margin-bottom:.75rem">' +
      '<div class="sec-lbl">Distribución por categoría</div>' +
      catMixBar(allRecsForKey, cats) +
    '</div>' +
    '<div class="card">' +
      '<div class="sec-lbl"><span>Detalle de productos en backstock &middot; ' + recs.length + ' de ' + allRecsForKey.length + '</span></div>' +
      productTableHtml(recs, isSup) +
    '</div>';
}

/* ---------------- INIT ---------------- */
renderPeriodPill();
renderChainFilters();
renderCatFilters();
renderTypeFilters();
renderHome();
</script>
</body>
</html>
