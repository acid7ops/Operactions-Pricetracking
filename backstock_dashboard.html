<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backstock Pool · Innovación & Sea Salt — Nivea Chile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --nivea:#0057A8; --nivea-deep:#00294F; --nivea-mid:#0A3D73; --nivea-light:#E6F1FB;
  --ink:#0B1C2C; --muted:#5B6B7C; --faint:#8698A8;
  --paper:#FFFFFF; --canvas:#EEF3F9; --line:#DCE6F0; --mist:#E7EFF8;
  --green:#158A4A; --green-bg:#EAF3DE;
  --red:#C0392B; --red-bg:#FCEBEB;
  --back:#B8620A; --back-bg:#FFF3E0;
  --innov:#8E2A9E; --innov-bg:#F3E6F7;
  --seasalt:#0B6E7A; --seasalt-bg:#E1F1F3;
  --msl:#8A5A2E; --msl-bg:#F3E9DE;
  --gold:#A67C00; --gold-bg:#FBF3DA;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --sh-sm:0 1px 3px rgba(10,27,46,.07);
  --sh-md:0 4px 16px rgba(10,27,46,.09);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{
  font-family:'Inter',sans-serif;
  background:var(--canvas);
  color:var(--ink);
  font-size:12px;
  overflow-x:hidden;
  max-width:100vw;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}

.topbar{
  background:linear-gradient(135deg, var(--nivea-deep) 0%, var(--nivea-mid) 100%);
  padding:.6rem 1.4rem;
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
  position:sticky;top:0;z-index:200;
  box-shadow:0 4px 20px rgba(10,27,46,.18);
}
.topbar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--nivea-mid),var(--seasalt),var(--nivea-mid));
}
.tb-brand{
  color:white;font-family:'Space Grotesk',sans-serif;
  font-size:15px;font-weight:700;letter-spacing:-.01em;
  padding-right:1.1rem;border-right:1px solid rgba(255,255,255,.18);
  white-space:nowrap;display:flex;flex-direction:column;gap:1px;
}
.tb-brand::before{
  content:'POOL INNOVACIÓN & SEA SALT'; font-family:'IBM Plex Mono',monospace;
  font-size:8.5px;letter-spacing:.14em;color:#A9CDEF;font-weight:500;
}
.tb-nav{display:flex;gap:4px}
.tb-nav-btn{
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;padding:6px 14px;
  border-radius:20px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);
  color:#BFD4E8;cursor:pointer;transition:all .15s;
}
.tb-nav-btn:hover{background:rgba(255,255,255,.22)}
.tb-nav-btn.active{background:white;color:var(--nivea-deep);border-color:white}
.tb-right{display:flex;gap:6px;align-items:center;margin-left:auto}
.btn{
  font-family:'Inter',sans-serif;font-size:11px;padding:5px 13px;border-radius:var(--r-sm);
  border:none;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block;
  background:rgba(255,255,255,.15);color:white;transition:background .15s;letter-spacing:.01em;
}
.btn:hover{background:rgba(255,255,255,.28)}
.period-pill{display:flex;background:rgba(255,255,255,.12);border-radius:20px;padding:3px;border:1px solid rgba(255,255,255,.22)}
.period-opt{
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;padding:5px 12px;
  border-radius:18px;cursor:pointer;color:#BFD4E8;transition:all .15s;border:none;background:none;white-space:nowrap;
}
.period-opt.active{background:white;color:var(--nivea-deep)}

.catbar{
  background:var(--paper);border-bottom:1px solid var(--line);
  padding:.65rem 1.4rem;box-shadow:var(--sh-sm);position:sticky;top:42px;z-index:199;
}
.catbar-label{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.cat-btn-row{display:flex;gap:6px;flex-wrap:wrap}
.cat-btn{
  font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;
  padding:7px 16px;border-radius:20px;border:1.5px solid var(--line);
  background:white;cursor:pointer;color:var(--muted);transition:all .15s;
}
.cat-btn:hover{border-color:var(--nivea);color:var(--nivea)}
.cat-btn.active{background:var(--nivea-deep);color:white;border-color:var(--nivea-deep)}

.subfilterbar{
  background:var(--mist);border-bottom:1px solid var(--line);
  padding:.5rem 1.4rem;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
  position:sticky;top:96px;z-index:198;
}
.f-group{display:flex;flex-direction:column;gap:3px}
.f-label{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.f-select{
  font-family:'Inter',sans-serif;font-size:11px;font-weight:600;color:var(--ink);
  padding:6px 28px 6px 10px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:white url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%235B6B7C"/></svg>') no-repeat right 9px center;
  appearance:none;-webkit-appearance:none;cursor:pointer;min-width:130px;transition:border-color .15s;
}
.f-select:hover, .f-select:focus{border-color:var(--nivea);outline:none}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:280px}
.search-input{
  width:100%;font-family:'Inter',sans-serif;font-size:11px;
  padding:6.5px 10px;border:1px solid var(--line);border-radius:var(--r-sm);
  outline:none;color:var(--ink);background:white;
}
.search-input:focus{border-color:var(--nivea)}
.search-drop{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  background:white;border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--sh-md);max-height:300px;overflow-y:auto;z-index:250;display:none;
}
.search-drop.show{display:block}
.search-item{padding:7px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:.5px solid var(--mist);font-size:11px}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:var(--nivea-light)}
.si-code{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--nivea-deep)}
.si-sub{font-size:9.5px;color:var(--faint);font-family:'IBM Plex Mono',monospace}
.clear-btn{
  font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;padding:6.5px 12px;
  border-radius:var(--r-sm);border:1px solid var(--line);background:white;color:var(--muted);cursor:pointer;
}
.clear-btn:hover{border-color:var(--red);color:var(--red)}

.page{max-width:1200px;margin:.9rem auto;padding:0 1.2rem}
.info-banner{
  background:var(--nivea-light);border:1px solid var(--nivea);border-radius:var(--r-md);
  padding:.55rem .9rem;margin-bottom:.75rem;font-size:10.5px;color:var(--nivea-deep);
  display:flex;gap:8px;align-items:flex-start;
}
.info-banner b{font-weight:700}
.ph{
  background:white;border-radius:var(--r-lg);padding:.8rem 1.2rem;margin-bottom:.75rem;
  border-left:4px solid var(--seasalt);display:flex;justify-content:space-between;align-items:flex-start;
  flex-wrap:wrap;gap:12px;box-shadow:var(--sh-sm);
}
.ph-left{display:flex;gap:12px;align-items:center}
.ph-img{width:56px;height:56px;border-radius:var(--r-sm);object-fit:contain;background:var(--canvas);border:1px solid var(--line);flex-shrink:0}
.ph-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;letter-spacing:-.01em}
.ph-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--faint);margin-top:3px;letter-spacing:.03em}
.ph-badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.badge{
  font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;
  padding:3px 9px;border-radius:20px;letter-spacing:.04em;white-space:nowrap;
}
.b-blue{background:var(--nivea-light);color:var(--nivea)}
.b-dark{background:var(--nivea-deep);color:white}
.b-warn{background:var(--back-bg);color:var(--back)}
.b-innov{background:var(--innov-bg);color:var(--innov)}
.b-seasalt{background:var(--seasalt-bg);color:var(--seasalt)}
.b-msl{background:var(--msl-bg);color:var(--msl)}
.b-ok{background:var(--green-bg);color:var(--green)}
.b-bad{background:var(--red-bg);color:var(--red)}
.nav-btn{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;
  padding:4px 11px;border-radius:20px;border:1px solid var(--line);
  background:white;color:var(--muted);cursor:pointer;transition:all .15s;
}
.nav-btn:hover{border-color:var(--nivea);color:var(--nivea)}
.nav-btn:disabled{opacity:.4;cursor:default}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:.75rem}
.kpi{
  background:white;border-radius:var(--r-md);padding:.7rem .9rem;
  border:1px solid var(--line);border-left:3px solid var(--line);
  box-shadow:var(--sh-sm);transition:box-shadow .15s,transform .15s;
}
.kpi:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.kpi-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:4px}
.kpi-val{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;letter-spacing:-.01em}
.kpi-sub{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--faint);margin-top:2px;letter-spacing:.03em}

.main{display:flex;gap:.75rem;margin-bottom:.75rem;align-items:flex-start}
.left-col{display:flex;flex-direction:column;gap:.75rem;flex:1;min-width:0}
.rcol{display:flex;flex-direction:column;gap:.75rem;width:260px;flex-shrink:0}
.card{background:white;border-radius:var(--r-lg);padding:.85rem 1.1rem;border:1px solid var(--line);box-shadow:var(--sh-sm)}
.sec-lbl{
  font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--faint);margin-bottom:.6rem;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;
}

.toggle-pill{display:flex;background:var(--canvas);border-radius:20px;padding:3px;border:1px solid var(--line)}
.toggle-opt{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;padding:5px 12px;border-radius:18px;cursor:pointer;color:var(--muted);transition:all .15s;border:none;background:none}
.toggle-opt.active{background:var(--nivea-deep);color:white}

.mini-row{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:.5px solid var(--mist);cursor:pointer;transition:background .1s}
.mini-row:last-child{border-bottom:none}
.mini-row:hover{background:var(--mist)}
.mini-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;color:var(--ink);width:96px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-bar-wrap{flex:1;background:var(--mist);border-radius:20px;height:6px;overflow:hidden}
.mini-bar{height:100%;border-radius:20px;background:var(--nivea)}
.mini-val{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;width:28px;text-align:right;flex-shrink:0}

table.pt{width:100%;border-collapse:collapse;font-size:11px}
table.pt th{
  font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:600;color:var(--faint);
  padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;background:var(--canvas);
  white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;
}
table.pt td{padding:6px 8px;border-bottom:.5px solid var(--mist);vertical-align:middle}
table.pt tr:last-child td{border-bottom:none}
table.pt tr:hover td{background:var(--mist)}
.prod-name{font-size:10.5px;line-height:1.35;display:flex;align-items:center;gap:8px}
.prod-thumb{width:30px;height:30px;border-radius:5px;object-fit:contain;background:var(--canvas);border:1px solid var(--line);flex-shrink:0}
.ean-code{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted)}
.type-pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.02em}
.chain-pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;letter-spacing:.02em;background:var(--nivea-light);color:var(--nivea-deep)}
.store-link{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--nivea-deep);cursor:pointer}
.store-link:hover{text-decoration:underline}
.sku-link{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--nivea-deep);cursor:pointer}
.sku-link:hover{text-decoration:underline}
.ver-link{
  font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;padding:3px 10px;border-radius:20px;
  border:1px solid var(--nivea);background:white;color:var(--nivea);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;
}
.ver-link:hover{background:var(--nivea);color:white}

.trend-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;white-space:nowrap}
.trend-up{color:var(--red)}
.trend-down{color:var(--green)}
.trend-flat{color:var(--faint)}
.trend-new{color:var(--nivea)}

.rank-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:.5px solid var(--mist);cursor:pointer;transition:background .1s}
.rank-row:hover{background:var(--mist)}
.rank-row:last-child{border-bottom:none}
.rank-pos{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;color:var(--faint);width:16px;text-align:center;flex-shrink:0}
.rank-thumb{width:32px;height:32px;border-radius:6px;object-fit:contain;background:var(--canvas);border:1px solid var(--line);flex-shrink:0}
.rank-info{width:180px;flex-shrink:0;overflow:hidden}
.rank-name{font-family:'Inter',sans-serif;font-weight:600;font-size:10.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-pills{display:flex;gap:4px;margin-top:2px}
.rank-bar-wrap{flex:1;background:var(--mist);border-radius:20px;height:7px;overflow:hidden}
.rank-bar{height:100%;border-radius:20px;background:var(--back)}
.rank-val{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;width:56px;text-align:right;flex-shrink:0}
.rank-trend{width:80px;text-align:right;flex-shrink:0}

.hero{background:white;border-radius:var(--r-lg);padding:1.3rem 1.4rem 1rem;margin-bottom:.75rem;border:1px solid var(--line);box-shadow:var(--sh-sm);text-align:center}
.hero-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;margin-bottom:.3rem}
.hero-sub{font-size:11.5px;color:var(--muted);max-width:600px;margin:0 auto}

.empty-hint{text-align:center;padding:2rem 1rem;color:var(--faint);font-size:11.5px}
.footer{text-align:center;padding:.7rem;font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--faint);margin-top:.3rem;letter-spacing:.04em}

.spark-wrap{display:flex;align-items:center;gap:2px;height:24px}
.spark-bar{width:8px;border-radius:2px 2px 0 0;background:var(--nivea-light);position:relative}
.spark-bar.cur{background:var(--back)}

.trend-table-wrap{overflow-x:auto}
.ch-wrap{position:relative;height:220px;width:100%;margin-bottom:.5rem}

@media print{ .topbar,.catbar,.subfilterbar{display:none} .page{padding:0;margin:0;max-width:100%} }
@media(max-width:860px){
  .main{flex-direction:column}
  .rcol{width:100%}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .subfilterbar{position:static}
  .catbar{position:static}
}
</style>
</head>

<div class="topbar">
  <div class="tb-brand">Nivea &middot; Chile</div>
  <div class="tb-nav">
    <button class="tb-nav-btn active" id="nav-home" onclick="goNav('home')">Ranking</button>

  });
}

/* ---------------- TREND HELPERS ---------------- */
function countsAcrossWeeks(mode, key){
  return PERIODS.map(function(p){
    return RECORDS.filter(function(r){
      if (r.period !== p) return false;
      if (mode==='sku' && skuKey(r)!==key) return false;
      if (mode==='sup' && r.sup!==key) return false;
      if (mode==='store' && r.store!==key) return false;
      if (curCat!=='ALL' && r.cat!==curCat) return false;
      if (curChainFilter!=='ALL' && r.chain!==curChainFilter) return false;
      if (curSupFilter!=='ALL' && r.sup!==curSupFilter) return false;
      if (curStoreFilter!=='ALL' && r.store!==curStoreFilter) return false;
      if (curTypeFilter!=='ALL' && r.type!==curTypeFilter) return false;
      if (curPoolFilter!=='ALL' && r.pool!==curPoolFilter) return false;
      return true;
    }).length;
  });
}
function trendContextLabel(){
  var parts = [];
  if (curSupFilter!=='ALL') parts.push(curSupFilter);
  if (curStoreFilter!=='ALL') parts.push(curStoreFilter);
  if (curChainFilter!=='ALL') parts.push(curChainFilter);
  return parts.length ? ' &middot; ' + parts.join(' &middot; ') : '';
}
function trendInfo(mode, key){
  var idx = PERIODS.indexOf(curPeriod);
  if (idx <= 0) return null;
  var prevP = PERIODS[idx-1];
  var cur = RECORDS.filter(function(r){ return r.period===curPeriod && (mode==='sku'?skuKey(r)===key:mode==='sup'?r.sup===key:r.store===key); }).length;
  var prev = RECORDS.filter(function(r){ return r.period===prevP && (mode==='sku'?skuKey(r)===key:mode==='sup'?r.sup===key:r.store===key); }).length;
  if (prev === 0) return {tag:'nuevo'};
  var delta = cur - prev;
  var pct = Math.round(delta/prev*100);
  return {tag: delta<0?'down':delta>0?'up':'flat', delta:delta, pct:pct, prev:prev, cur:cur};
}
function trendHtml(mode, key){
  var t = trendInfo(mode, key);
  if (!t) return '<span class="trend-tag trend-flat">&mdash;</span>';
  if (t.tag==='nuevo') return '<span class="trend-tag trend-new">Nuevo</span>';
  if (t.tag==='flat') return '<span class="trend-tag trend-flat">&#61; igual</span>';
  if (t.tag==='down') return '<span class="trend-tag trend-down">&#8595; '+t.delta+' ('+t.pct+'%)</span>';
  return '<span class="trend-tag trend-up">&#8593; +'+t.delta+' (+'+t.pct+'%)</span>';
}
function sparkline(counts){
  var max = Math.max.apply(null, counts.concat([1]));
  return '<div class="spark-wrap">' + counts.map(function(c,i){
    var h = Math.max(3, Math.round(c/max*22));
    var cls = i===counts.length-1 ? 'spark-bar cur' : 'spark-bar';
    return '<div class="'+cls+'" style="height:'+h+'px" title="'+PERIOD_SHORT[PERIODS[i]]+': '+c+'"></div>';
  }).join('') + '</div>';
}

/* ---------------- FILTER BAR (cascading) ---------------- */
function baseFilteredExcept(exclude){
  return periodRecords(curPeriod).filter(function(r){
    return (exclude==='chain' || curChainFilter==='ALL' || r.chain===curChainFilter) &&
           (exclude==='sup'   || curSupFilter==='ALL'   || r.sup===curSupFilter) &&
           (exclude==='store' || curStoreFilter==='ALL' || r.store===curStoreFilter) &&
           (exclude==='type'  || curTypeFilter==='ALL'  || r.type===curTypeFilter) &&
           (exclude==='pool'  || curPoolFilter==='ALL'  || r.pool===curPoolFilter);
  });
}
function uniqueVals(recs, key){ var s={}; recs.forEach(function(r){ s[r[key]]=true; }); return Object.keys(s).sort(); }
function chainOptionsList(){ return uniqueVals(baseFilteredExcept('chain'), 'chain'); }
function supOptionsList(){ return uniqueVals(baseFilteredExcept('sup'), 'sup'); }
function storeOptionsList(){ return uniqueVals(baseFilteredExcept('store'), 'store'); }
function typeOptionsList(){ return uniqueVals(baseFilteredExcept('type'), 'type'); }
function poolOptionsList(){ return uniqueVals(baseFilteredExcept('pool'), 'pool'); }

  if (justChanged !== 'store'){ var o3=storeOptionsList(); if(curStoreFilter!=='ALL' && o3.indexOf(curStoreFilter)===-1) curStoreFilter='ALL'; }
  if (justChanged !== 'type'){ var o4=typeOptionsList(); if(curTypeFilter!=='ALL' && o4.indexOf(curTypeFilter)===-1) curTypeFilter='ALL'; }
  if (justChanged !== 'pool'){ var o5=poolOptionsList(); if(curPoolFilter!=='ALL' && o5.indexOf(curPoolFilter)===-1) curPoolFilter='ALL'; }

/* ---------------- SKU DETAIL ---------------- */
function renderSkuDetail(){
  var allForKey = RECORDS.filter(function(r){ return r.period===curPeriod && skuKey(r)===detailKey; });

  var ps = POOL_STYLE[ref.pool]||{color:'var(--muted)',bg:'var(--mist)'};

  var skuGroups = groupBy(periodRecords(curPeriod).filter(function(r){return (curCat==='ALL'||r.cat===curCat);}), skuKey);
  var navList = Object.keys(skuGroups).sort(function(a,b){ return skuGroups[b].length - skuGroups[a].length; });
  var idx = navList.indexOf(detailKey);

  var stores = {}; allForKey.forEach(function(r){stores[r.store]=true;});
  var chains = {}; allForKey.forEach(function(r){chains[r.chain]=true;});
  var counts = countsAcrossWeeks('sku', detailKey);

  document.getElementById('page').innerHTML =
    '<div class="ph">'+
      '<div class="ph-left">'+
        (ref.img?'<img class="ph-img" src="'+ref.img+'" onerror="this.style.display=\'none\'">':'')+
        '<div><div class="ph-title">'+ref.prod+'</div><div class="ph-sub">EAN '+(ref.ean||'—')+' &middot; '+ref.cat+'</div></div>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">'+
        '<div class="ph-badges">'+
          '<span class="badge b-dark">SKU</span>'+
          '<span class="badge" style="background:'+ts.bg+';color:'+ts.color+'">'+(ref.type==='Innovación'?'★ ':'')+ref.type+'</span>'+
          '<span class="badge" style="background:'+ps.bg+';color:'+ps.color+'">'+ref.pool+'</span>'+
          '<span class="badge b-warn">'+allForKey.length+' casos '+PERIOD_SHORT[curPeriod]+'</span>'+
        '</div>'+
        '<div style="display:flex;gap:5px">'+
          '<button class="nav-btn" onclick="goHome()">&larr; Inicio</button>'+
          '<button class="nav-btn" onclick="stepSku(-1)"'+(idx<=0?' disabled':'')+'>&larr; Anterior</button>'+
          '<button class="nav-btn" onclick="stepSku(1)"'+(idx>=navList.length-1?' disabled':'')+'>Siguiente &rarr;</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="kpis" style="grid-template-columns:repeat(3,1fr)">'+
      '<div class="kpi" style="border-left-color:var(--back)"><div class="kpi-lbl">Total Backstock ('+PERIOD_SHORT[curPeriod]+')</div><div class="kpi-val" style="color:var(--back)">'+allForKey.length+'</div></div>'+
      '<div class="kpi" style="border-left-color:var(--nivea)"><div class="kpi-lbl">Locales afectados</div><div class="kpi-val">'+Object.keys(stores).length+'</div></div>'+
      '<div class="kpi" style="border-left-color:var(--nivea)"><div class="kpi-lbl">Cadenas afectadas</div><div class="kpi-val">'+Object.keys(chains).length+'</div></div>'+
    '</div>'+
    '<div class="card" style="margin-bottom:.75rem">'+
      '<div class="sec-lbl">Evolución 4 semanas'+trendContextLabel()+' &middot; '+counts.join(' &rarr; ')+'</div>'+
      '<div class="ch-wrap"><canvas id="sku-trend-chart"></canvas></div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="sec-lbl">Dónde está el problema ('+PERIOD_SHORT[curPeriod]+') &middot; '+recs.length+' de '+allForKey.length+'</div>'+
      skuStoreTableHtml(recs)+
    '</div>';

  drawSkuTrendChart(counts);
}

function drawSkuTrendChart(counts){
  if (trendChart) trendChart.destroy();
  var ctx = document.getElementById('sku-trend-chart');
  if (!ctx || typeof Chart === 'undefined') return;
  trendChart = new Chart(ctx, {
    type:'line',
    data:{ labels: PERIODS.map(function(p){return PERIOD_SHORT[p];}), datasets:[{
      label:'Casos backstock', data: counts, borderColor:'#B8620A', backgroundColor:'rgba(184,98,10,.1)',
      borderWidth:2, tension:.25, pointRadius:5, pointBackgroundColor:'#B8620A', fill:true
    }]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{ y:{ beginAtZero:true, ticks:{stepSize:1, precision:0} } }
    }
  });
}

function skuStoreTableHtml(recs){
  if(!recs.length) return '<div class="empty-hint">Sin casos para este filtro.</div>';
  var sorted = recs.slice().sort(function(a,b){ return a.store<b.store?-1:1; });
  var rows = sorted.map(function(r){
    var ts = TYPE_STYLE[r.type]||{color:'var(--muted)',bg:'var(--mist)'};
    var ps = POOL_STYLE[r.pool]||{color:'var(--muted)',bg:'var(--mist)'};
    return '<tr><td style="width:90px"><span class="store-link" onclick="goDetail(\'store\',\''+r.store+'\')">'+r.store+'</span></td>'+
      '<td style="width:110px"><span class="chain-pill">'+r.chain+'</span></td>'+
      '<td style="width:160px"><span class="sku-link" onclick="goDetail(\'sup\',\''+r.sup.replace(/'/g,"\\'")+'\')">'+r.sup+'</span></td>'+
      '<td style="width:100px"><span class="type-pill" style="background:'+ts.bg+';color:'+ts.color+'">'+(r.type==='Innovación'?'★ ':'')+r.type+'</span></td>'+
      '<td style="width:100px"><span class="type-pill" style="background:'+ps.bg+';color:'+ps.color+'">'+r.pool+'</span></td>'+
      '<td></td>'+
      '<td style="width:60px">'+(r.img?'<a class="ver-link" href="'+r.img+'" target="_blank" rel="noopener">Ver &#8599;</a>':'')+'</td></tr>';
  }).join('');
  return '<table class="pt"><thead><tr><th>Local</th><th>Cadena</th><th>Supervisor</th><th>Type</th><th>Programa</th><th></th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function stepSku(dir){
  var skuGroups = groupBy(periodRecords(curPeriod).filter(function(r){return (curCat==='ALL'||r.cat===curCat);}), skuKey);
  var navList = Object.keys(skuGroups).sort(function(a,b){ return skuGroups[b].length - skuGroups[a].length; });
  var idx = navList.indexOf(detailKey) + dir;
  if(idx<0||idx>=navList.length) return;
  goDetail('sku', navList[idx]);
}

/* ---------------- SUPERVISOR / STORE DETAIL ---------------- */
function renderSupStoreDetail(){
  var isSup = detailType === 'sup';
  var allForKey = RECORDS.filter(function(r){ return r.period===curPeriod && (isSup ? r.sup===detailKey : r.store===detailKey); });
  var recs = allForKey.filter(function(r){
    return (curCat==='ALL'||r.cat===curCat) && (curChainFilter==='ALL'||r.chain===curChainFilter) && (isSup ? (curStoreFilter==='ALL'||r.store===curStoreFilter) : true) && (curTypeFilter==='ALL'||r.type===curTypeFilter) && (curPoolFilter==='ALL'||r.pool===curPoolFilter);
  });
  var relatedStores = isSup ? supervisorStores(detailKey) : [detailKey];
  var navList = isSup ? supList() : storeList();
  var idx = navList.indexOf(detailKey);
  var counts = countsAcrossWeeks(isSup?'sup':'store', detailKey);

  var badges = '<span class="badge b-dark">'+(isSup?'Supervisor':'Local')+'</span>'+
    '<span class="badge b-warn">'+allForKey.length+' casos '+PERIOD_SHORT[curPeriod]+'</span>';

  document.getElementById('page').innerHTML =
    '<div class="ph">'+
      '<div><div class="ph-title">'+detailKey+'</div><div class="ph-sub">'+(isSup?(relatedStores.length+' locales a cargo'):(storeChain(detailKey)+' · Supervisor: '+storeSupervisor(detailKey)))+'</div></div>'+
      '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">'+
        '<div class="ph-badges">'+badges+'</div>'+
        '<div style="display:flex;gap:5px">'+
          '<button class="nav-btn" onclick="goHome()">&larr; Inicio</button>'+
          '<button class="nav-btn" onclick="stepSupStore(-1)"'+(idx<=0?' disabled':'')+'>&larr; Anterior</button>'+
          '<button class="nav-btn" onclick="stepSupStore(1)"'+(idx>=navList.length-1?' disabled':'')+'>Siguiente &rarr;</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="kpis">'+
      '<div class="kpi" style="border-left-color:var(--back)"><div class="kpi-lbl">Total Backstock</div><div class="kpi-val" style="color:var(--back)">'+allForKey.length+'</div></div>'+
      '<div class="kpi" style="border-left-color:var(--nivea)"><div class="kpi-lbl">Locales</div><div class="kpi-val">'+relatedStores.length+'</div></div>'+
    '</div>'+
    '<div class="card" style="margin-bottom:.75rem">'+
      '<div class="sec-lbl">Evolución 4 semanas &middot; '+counts.join(' &rarr; ')+'</div>'+
      '<div class="ch-wrap"><canvas id="sku-trend-chart"></canvas></div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="sec-lbl">Detalle de productos en backstock &middot; '+recs.length+' de '+allForKey.length+'</div>'+
      productTableHtml(recs, isSup)+
    '</div>';

  drawSkuTrendChart(counts);
}

function productTableHtml(recs, isSup){
  if(!recs.length) return '<div class="empty-hint">Sin productos en backstock para este filtro.</div>';
  var sorted = recs.slice().sort(function(a,b){ if(a.store!==b.store) return a.store<b.store?-1:1; return a.prod<b.prod?-1:1; });
  var rows = sorted.map(function(r){
    var ts = TYPE_STYLE[r.type]||{color:'var(--muted)',bg:'var(--mist)'};
    var ps = POOL_STYLE[r.pool]||{color:'var(--muted)',bg:'var(--mist)'};
    var storeCell = isSup ? '<span class="store-link" onclick="goDetail(\'store\',\''+r.store+'\')">'+r.store+'</span>' : r.store;
    return '<tr><td class="prod-name">'+(r.img?'<img class="prod-thumb" src="'+r.img+'" onerror="this.style.display=\'none\'">':'')+
      '<span class="sku-link" onclick="goDetail(\'sku\',\''+skuKey(r).replace(/'/g,"\\'")+'\')">'+r.prod+'</span></td>'+
      '<td class="ean-code">'+(r.ean||'—')+'</td>'+
      '<td><span class="type-pill" style="background:'+ts.bg+';color:'+ts.color+'">'+(r.type==='Innovación'?'★ ':'')+r.type+'</span></td>'+
      '<td><span class="type-pill" style="background:'+ps.bg+';color:'+ps.color+'">'+r.pool+'</span></td>'+
      (isSup ? '<td><span class="chain-pill">'+r.chain+'</span></td>' : '')+
      '<td>'+storeCell+'</td>'+
      '<td>'+(r.img?'<a class="ver-link" href="'+r.img+'" target="_blank" rel="noopener">Ver &#8599;</a>':'')+'</td></tr>';
  }).join('');
  var chainHeader = isSup ? '<th style="width:80px">Cadena</th>' : '';
  return '<table class="pt"><thead><tr><th>Producto</th><th style="width:100px">EAN</th><th style="width:90px">Type</th><th style="width:90px">Programa</th>'+chainHeader+'<th style="width:70px">Local</th><th style="width:60px"></th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function stepSupStore(dir){
  var isSup = detailType==='sup';
  var navList = isSup ? supList() : storeList();
  var idx = navList.indexOf(detailKey) + dir;
  if(idx<0||idx>=navList.length) return;
  goDetail(detailType, navList[idx]);
}

function renderDetail(){
  if (detailType === 'sku') renderSkuDetail();
  else renderSupStoreDetail();
}

/* ---------------- INIT ---------------- */
renderPeriodPill();
refreshFilterBar();
</script>
</body>
</html>
