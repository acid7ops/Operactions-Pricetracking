<style>
:root{

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--canvas);color:var(--ink);font-size:12px}
.topbar{
  background:linear-gradient(135deg, var(--nivea-deep) 0%, var(--nivea-mid) 100%);
  padding:.7rem 1.4rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:100;
  box-shadow:0 4px 20px rgba(10,27,46,.18);
}
.tb-brand{color:white;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700}
.tb-brand::before{content:'CATÁLOGO DE SKUS';display:block;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.14em;color:#A9CDEF;font-weight:500}
.tb-right{margin-left:auto}
.btn{font-family:'Inter',sans-serif;font-size:11px;padding:5px 13px;border-radius:6px;border:none;cursor:pointer;font-weight:600;background:rgba(255,255,255,.15);color:white;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.28)}

.filterbar{background:white;border-bottom:1px solid var(--line);padding:.6rem 1.4rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:48px;z-index:99}
.f-btn{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;padding:6px 15px;border-radius:20px;border:1.5px solid var(--line);background:white;cursor:pointer;color:var(--muted)}
.f-btn.active{background:var(--nivea-deep);color:white;border-color:var(--nivea-deep)}
.f-sep{width:1px;height:20px;background:var(--line);margin:0 4px}

.page{max-width:1200px;margin:0 auto;padding:1.5rem 1.4rem 3rem}
.hero{text-align:center;margin-bottom:1.5rem}
.hero-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-bottom:.4rem}
.hero-sub{color:var(--muted);font-size:12.5px;max-width:600px;margin:0 auto}
.stats-row{display:flex;justify-content:center;gap:10px;margin-top:1rem;flex-wrap:wrap}
.stat-pill{background:white;border:1px solid var(--line);border-radius:20px;padding:6px 16px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600}
.stat-pill b{font-family:'Space Grotesk',sans-serif;font-size:14px;margin-right:5px}

.cat-section{margin-bottom:1.8rem}
.cat-header{
  font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--nivea-deep);
  margin-bottom:.7rem;padding-bottom:.4rem;border-bottom:2px solid var(--nivea);
  display:flex;align-items:center;gap:8px;
}
.cat-count{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;color:var(--faint);background:var(--mist);padding:2px 9px;border-radius:20px}

.sku-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sku-card{background:white;border:1px solid var(--line);border-radius:var(--r-lg);padding:1rem;box-shadow:var(--sh-sm);transition:box-shadow .15s,transform .15s}
.sku-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.sku-img-wrap{width:100%;height:120px;display:flex;align-items:center;justify-content:center;background:var(--canvas);border-radius:var(--r-md);margin-bottom:.7rem;overflow:hidden}
.sku-img-wrap img{max-width:100%;max-height:100%;object-fit:contain}
.sku-name{font-size:11.5px;font-weight:600;line-height:1.4;margin-bottom:.5rem;min-height:32px}
.sku-meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--faint);margin-bottom:.6rem}
.sku-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.6rem}
.badge{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.02em}
.b-innov{background:var(--innov-bg);color:var(--innov)}
.b-gold{background:var(--gold-bg);color:var(--gold)}
.b-seasalt{background:var(--seasalt-bg);color:var(--seasalt)}
.b-msl{background:var(--msl-bg);color:var(--msl)}
.sku-formats{font-size:9.5px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:.5rem}
.sku-formats div{display:flex;justify-content:space-between}
.sku-formats b{color:var(--ink);font-family:'IBM Plex Mono',monospace}

.footer{text-align:center;padding:1.2rem;font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--faint)}
</style>

;
var curClass = 'ALL';
var curPool = 'ALL';

function classList(){ var s={}; CATALOG.forEach(function(c){s[c['class']]=true;}); return Object.keys(s).sort(); }
function poolList(){ var s={}; CATALOG.forEach(function(c){s[c.pool]=true;}); return Object.keys(s).sort(); }
function badgeFor(cls){
  if(cls==='Innovación') return '<span class="badge b-innov">★ Innovación</span>';
  if(cls==='Gold') return '<span class="badge b-gold">Gold</span>';
  return '<span class="badge">'+cls+'</span>';
}
function poolBadge(p){
  if(p==='Sea Salt') return '<span class="badge b-seasalt">Sea Salt</span>';
  if(p==='MSL') return '<span class="badge b-msl">MSL</span>';
  return '<span class="badge">'+p+'</span>';
}

function setClass(c){ curClass=c; render(); }
function setPool(p){ curPool=p; render(); }

function filtered(){
  return CATALOG.filter(function(c){
    return (curClass==='ALL'||c['class']===curClass) && (curPool==='ALL'||c.pool===curPool);
  });
}

function render(){
  document.getElementById('filterbar').innerHTML =
    classList().map(function(c){ return '<button class="f-btn'+(curClass===c?' active':'')+'" onclick="setClass(\''+c+'\')">'+c+'</button>'; }).join('') +
    '<button class="f-btn'+(curClass==='ALL'?' active':'')+'" onclick="setClass(\'ALL\')" style="order:-1">Todos los Class</button>' +
    '<div class="f-sep"></div>' +
    poolList().map(function(p){ return '<button class="f-btn'+(curPool===p?' active':'')+'" onclick="setPool(\''+p+'\')">'+p+'</button>'; }).join('') +
    '<button class="f-btn'+(curPool==='ALL'?' active':'')+'" onclick="setPool(\'ALL\')" style="order:-1">Todos los Programa</button>';

  var recs = filtered();
  var innovCount = CATALOG.filter(function(c){return c['class']==='Innovación';}).length;
  var seasaltCount = CATALOG.filter(function(c){return c.pool==='Sea Salt';}).length;
  var mslCount = CATALOG.filter(function(c){return c.pool==='MSL';}).length;
  document.getElementById('stats-row').innerHTML =
    '<div class="stat-pill"><b>'+CATALOG.length+'</b>SKUs totales</div>'+
    '<div class="stat-pill"><b>'+innovCount+'</b>Innovación</div>'+
    '<div class="stat-pill"><b>'+seasaltCount+'</b>Sea Salt</div>'+
    '<div class="stat-pill"><b>'+mslCount+'</b>MSL</div>';

  var byCat = {};
  recs.forEach(function(c){ if(!byCat[c.cat]) byCat[c.cat]=[]; byCat[c.cat].push(c); });
  var cats = Object.keys(byCat).sort();

  document.getElementById('catalog-content').innerHTML = cats.map(function(cat){
    var items = byCat[cat];
    var cardsHtml = items.map(function(sku){
      var formatsHtml = Object.keys(sku.formats).map(function(f){
        return '<div><span>'+f+'</span><b>'+sku.formats[f]+' facing(s)</b></div>';
      }).join('');
      return '<div class="sku-card">'+
        '<div class="sku-img-wrap">'+(sku.img?'<img src="'+sku.img+'" onerror="this.parentElement.style.display=\'none\'">':'')+'</div>'+
        '<div class="sku-name">'+sku.name+'</div>'+
        '<div class="sku-meta">SPGR '+sku.spgr+'</div>'+
        '<div class="sku-badges">'+badgeFor(sku['class'])+poolBadge(sku.pool)+'</div>'+
        '<div class="sku-formats">'+formatsHtml+'</div>'+
      '</div>';
    }).join('');
    return '<div class="cat-section">'+
      '<div class="cat-header">'+cat+' <span class="cat-count">'+items.length+' SKU'+(items.length>1?'s':'')+'</span></div>'+
      '<div class="sku-grid">'+cardsHtml+'</div>'+
    '</div>';
  }).join('') || '<div style="text-align:center;padding:3rem;color:var(--faint)">Sin SKUs para este filtro.</div>';
}

render();
</script>

</html>
